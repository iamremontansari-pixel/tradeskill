name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Validate semver tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          node -e '
            const tag = process.argv[1];
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+/.test(tag)) {
              console.error(`::error::invalid release tag "${tag}" — expected semver like v1.10.1`);
              process.exit(1);
            }
            console.log(`✓ tag ${tag} is semver`);
          ' "${{ inputs.tag }}"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/trad-data

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: crates/trad-data

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: crates/trad-data

      - name: Run tests
        run: cargo test
        working-directory: crates/trad-data

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            use-cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use-cross: false
          # aarch64 MSVC 交叉链接器依赖镜像预装工具链，固定镜像版本抗漂移
          - target: aarch64-pc-windows-msvc
            os: windows-2025
            use-cross: false

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/trad-data
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross == true
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cross

      - name: Build release binary (native)
        if: matrix.use-cross == false
        env:
          # musl targets must stay statically linked; pin crt-static so a cross
          # toolchain default change cannot silently produce a glibc-dependent binary
          RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: crates/trad-data

      - name: Build release binary (cross)
        if: matrix.use-cross == true
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=+crt-static' || '' }}
        run: cross build --release --target ${{ matrix.target }}
        working-directory: crates/trad-data

      - name: Verify musl binary is statically linked
        if: contains(matrix.target, 'musl')
        run: |
          # rustc 对 x86_64 musl 默认产出 "static-pie linked"（static_position_independent_executables=true），
          # aarch64 musl 产出 "statically linked" —— 两种都是静态，都要接受。
          # 失败时输出 file 实际结果，便于诊断。
          out="$(file crates/trad-data/target/${{ matrix.target }}/release/trad-skill)"
          echo "$out"
          echo "$out" | grep -qE "static-pie linked|statically linked" || (echo "::error::musl binary not static: $out" && exit 1)

      - name: Prepare artifact (Unix)
        if: "!contains(matrix.target, 'windows')"
        run: |
          mkdir -p release
          cp crates/trad-data/target/${{ matrix.target }}/release/trad-skill release/trad-skill-${{ matrix.target }}
          chmod +x release/trad-skill-${{ matrix.target }}

      - name: Prepare artifact (Windows)
        if: contains(matrix.target, 'windows')
        shell: bash
        run: |
          mkdir -p release
          cp crates/trad-data/target/${{ matrix.target }}/release/trad-skill.exe release/trad-skill-${{ matrix.target }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bin-${{ matrix.target }}
          path: release/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: bin-*
          merge-multiple: true
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          # Rename .exe files to include target in name
          for f in *; do
            echo "$(sha256sum "$f" | awk '{print $1}')  $f" >> ../SHA256SUMS.txt
          done
          cat ../SHA256SUMS.txt

      - name: Extract changelog
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          TAG="${TAG#v}"
          # 字面匹配 "## [<version>]"（index 而非正则），避免 1.9 误匹配 1.9.0 小节
          awk -v tag="$TAG" '
            /^## / {
              if (index($0, "## [" tag "]") == 1) { found=1; next }
              found=0
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          # If no section found, use git log
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for ${TAG}, using git log." > release_notes.md
            git log --oneline -20 >> release_notes.md
          fi

      - name: Verify CHANGELOG section exists
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          TAG="${TAG#v}"
          if grep -q "No changelog entry found" release_notes.md; then
            echo "::error::CHANGELOG.md has no '## [${TAG}]' section — add one before releasing"
            exit 1
          fi

      - name: Build download table
        id: table
        run: |
          echo "## Downloads" > download_table.md
          echo "" >> download_table.md
          echo "| Platform | Architecture | Binary | SHA256 |" >> download_table.md
          echo "|----------|-------------|--------|--------|" >> download_table.md
          
          for f in artifacts/*; do
            fname=$(basename "$f")
            sha=$(grep "$fname" SHA256SUMS.txt | awk '{print $1}')
            
            # Parse target from filename
            target="${fname#trad-skill-}"
            target="${target%.exe}"
            
            # Determine platform and arch
            if echo "$target" | grep -q "linux-musl"; then
              platform="Linux (musl)"
            elif echo "$target" | grep -q "linux-gnu"; then
              platform="Linux (glibc)"
            elif echo "$target" | grep -q "apple-darwin"; then
              platform="macOS"
            elif echo "$target" | grep -q "windows"; then
              platform="Windows"
            else
              platform="Unknown"
            fi
            
            if echo "$target" | grep -q "x86_64"; then
              arch="x86_64"
            elif echo "$target" | grep -q "aarch64"; then
              arch="aarch64"
            else
              arch="unknown"
            fi
            
            echo "| ${platform} | ${arch} | ${fname} | \`${sha}\` |" >> download_table.md
          done

      - name: Combine release notes
        run: |
          cat release_notes.md > full_notes.md
          echo "" >> full_notes.md
          cat download_table.md >> full_notes.md
          echo "" >> full_notes.md
          echo "## Checksums" >> full_notes.md
          echo '```' >> full_notes.md
          cat SHA256SUMS.txt >> full_notes.md
          echo '```' >> full_notes.md

      - name: Verify all platform artifacts present
        shell: bash
        run: |
          missing=()
          for f in \
            trad-skill-x86_64-unknown-linux-gnu \
            trad-skill-aarch64-unknown-linux-gnu \
            trad-skill-aarch64-apple-darwin \
            trad-skill-x86_64-unknown-linux-musl \
            trad-skill-aarch64-unknown-linux-musl \
            trad-skill-x86_64-pc-windows-msvc.exe \
            trad-skill-aarch64-pc-windows-msvc.exe; do
            if [ ! -f "artifacts/$f" ]; then
              missing+=("$f")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing platform artifacts (${#missing[@]}/7):"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "✓ all 7 platform artifacts present under artifacts/"

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          body_path: full_notes.md
          files: |
            artifacts/*
            SHA256SUMS.txt
          fail_on_unmatched_files: true

  npm-publish:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # workflow_dispatch 必须 checkout 解析出的 tag 本身，而不是默认分支——
      # 否则发布的 package.json 版本可能与 tag 不一致
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.tag.outputs.value }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify version consistency with tag
        run: |
          VERSION="${{ steps.tag.outputs.value }}"
          VERSION="${VERSION#v}"
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const files = [
              "package.json",
              ...fs.readdirSync("npm").map(d => `npm/${d}/package.json`),
            ];
            for (const f of files) {
              const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
              if (pkg.version !== version) {
                console.error(`版本不一致: ${f} = ${pkg.version}，tag = ${version}`);
                process.exit(1);
              }
            }
            const cargo = fs.readFileSync("crates/trad-data/Cargo.toml", "utf8");
            const m = cargo.match(/^version\s*=\s*"([^"]+)"/m);
            if (!m || m[1] !== version) {
              console.error(`Cargo.toml 版本不一致: ${m ? m[1] : "未找到"}，tag = ${version}`);
              process.exit(1);
            }
            const lock = fs.readFileSync("crates/trad-data/Cargo.lock", "utf8");
            const lm = lock.match(/name = "trad-data"\s*\n\s*version = "([^"]+)"/);
            if (!lm || lm[1] !== version) {
              console.error(`Cargo.lock 版本不一致: ${lm ? lm[1] : "未找到"}，tag = ${version}`);
              process.exit(1);
            }
            const mainPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const pins = Object.entries(mainPkg.optionalDependencies || {}).filter(([k]) => k.startsWith("@trad-skill/"));
            if (pins.length !== 5) {
              console.error(`optionalDependencies @trad-skill/* 数量异常: ${pins.length} 个，期望 5 个，tag = ${version}`);
              process.exit(1);
            }
            const badPins = pins.filter(([, v]) => v !== version);
            if (badPins.length > 0) {
              for (const [k, v] of badPins) {
                console.error(`optionalDependencies 版本不一致: ${k} = ${v}，tag = ${version}`);
              }
              process.exit(1);
            }
            console.log(`✓ ${files.length} 个 npm manifest + Cargo.toml + Cargo.lock + ${pins.length} 个 optionalDependencies pin 与 tag v${version} 一致`);
          ' "$VERSION"

      - name: Remove deprecated always-auth from .npmrc
        run: sed -i '/always-auth/d' .npmrc 2>/dev/null || true

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: bin-*
          merge-multiple: true
          path: artifacts

      - name: Prepare platform packages
        run: |
          cp artifacts/trad-skill-x86_64-pc-windows-msvc.exe npm/win32-x64/trad-skill.exe
          cp artifacts/trad-skill-aarch64-pc-windows-msvc.exe npm/win32-arm64/trad-skill.exe
          cp artifacts/trad-skill-aarch64-apple-darwin npm/darwin-arm64/trad-skill
          cp artifacts/trad-skill-x86_64-unknown-linux-musl npm/linux-x64/trad-skill
          cp artifacts/trad-skill-aarch64-unknown-linux-musl npm/linux-arm64/trad-skill
          chmod +x npm/darwin-arm64/trad-skill npm/linux-x64/trad-skill npm/linux-arm64/trad-skill

      - name: Publish platform packages
        run: |
          for dir in npm/*/; do
            output=$(npm publish "$dir" --provenance --access public 2>&1) && rc=0 || rc=$?
            echo "$output"
            if [ $rc -ne 0 ]; then
              if echo "$output" | grep -q "cannot publish over"; then
                echo "::warning::$(basename $dir) already published, skipping"
              else
                echo "::error::$(basename $dir) publish failed"
                exit 1
              fi
            fi
          done

      - name: Publish main package
        run: npm publish --provenance --access public
