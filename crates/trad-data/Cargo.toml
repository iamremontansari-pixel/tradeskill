[package]
name = "trad-data"
version = "1.10.0"
edition = "2021"
description = "TradingAgents skill: installer + data fetcher (Rust binary)"
license = "Apache-2.0"

[[bin]]
name = "trad-skill"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
serde = "1"
serde_json = "1"
quick-xml = "0.37"
chrono = "0.4"
# 东方财富基金接口返回 GBK 编码（响应头谎报 charset=utf-8），需按 GBK 解码。
# 纯 Rust 实现，无 C 依赖，兼容全部 7 个构建目标。
encoding_rs = "0.8"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
# 仅测试用：构造带自定义流式响应体（impl hyper::body::Body）的 reqwest::Response，
# 模拟无 Content-Length 的 chunked 传输。纯 Rust，无 C 依赖，兼容全部 7 个构建目标。
hyper = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
# 独立 CLI，无 catch_unwind：panic 直接 abort，进一步缩二进制
panic = "abort"
